<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión de Transporte — UNAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- 01 Login -->
  <section id="login-view" class="login-page hidden" aria-label="Inicio de sesión">
    <div class="login-card">
      <div class="login-form-side">
        <h1 class="login-title">Bienvenidos</h1>
        <p class="login-subtitle">Ingresa con tu cuenta de administrador para continuar.</p>

        <form id="login-form" novalidate>
          <div class="field-group" style="margin-bottom: 16px;">
            <label class="field-label" for="login-usuario">Usuario</label>
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input id="login-usuario" class="input" type="text" placeholder="admin" required autocomplete="username" />
            </div>
          </div>

          <div class="field-group" style="margin-bottom: 14px;">
            <label class="field-label" for="login-password">Contraseña</label>
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input id="login-password" class="input" type="password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" id="toggle-password-btn" class="login-eye-btn" aria-label="Mostrar u ocultar contraseña">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:24px;cursor:pointer;">
            <input type="checkbox" id="login-remember" />
            <span>Recordar mi usuario</span>
          </label>

          <p id="login-error" class="field-error hidden" style="margin-bottom:12px;"></p>

          <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%;height:44px;">
            <span>Ingresar al sistema</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
          </button>
        </form>
      </div>

      <div class="login-brand-side">
        <img src="assets/unab-logo.png" alt="Universidad Nacional de Barranca" class="login-brand-logo" />
        <h2 class="login-brand-title">Sistema de Gestión de Transporte</h2>
        <p class="login-brand-sub">Área de Transporte · Servicios Generales</p>
      </div>
    </div>
  </section>

  <!-- App Shell -->
  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-brand">
        <img src="assets/unab-logo.png" alt="UNAB" class="sidebar-logo" />
        <div>
          <div class="sidebar-brand-title">Transporte UNAB</div>
          <div class="sidebar-brand-sub">Servicios Generales</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Inicio</span>
        </button>

        <div class="nav-section-label">REGISTRO DIARIO</div>
        <button class="nav-item" data-route="turnos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <line x1="8" y1="7" x2="16" y2="7" />
            <line x1="8" y1="11" x2="16" y2="11" />
            <line x1="8" y1="15" x2="13" y2="15" />
          </svg>
          <span>Bitácora de turnos</span>
        </button>
        <button class="nav-item" data-route="combustible">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 22V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
            <path d="M15 10h2a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9l-3-3" />
            <line x1="6" y1="10" x2="12" y2="10" />
          </svg>
          <span>Combustible</span>
        </button>

        <div class="nav-section-label">FLOTA</div>
        <button class="nav-item" data-route="unidades">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <line x1="3" y1="11" x2="21" y2="11" />
            <circle cx="7.5" cy="19.5" r="1.5" />
            <circle cx="16.5" cy="19.5" r="1.5" />
          </svg>
          <span>Unidades</span>
        </button>
        <button class="nav-item" data-route="mantenimiento">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
          </svg>
          <span>Mantenimiento</span>
        </button>
        <button class="nav-item" data-route="conductores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Conductores</span>
        </button>
        <button class="nav-item" data-route="rutas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="19" r="3" />
            <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
            <circle cx="18" cy="5" r="3" />
          </svg>
          <span>Rutas</span>
        </button>

        <div class="nav-section-label">CONTROL</div>
        <button class="nav-item" data-route="reportes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          <span>Reportes</span>
        </button>
        <button class="nav-item" data-route="conciliacion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18" />
            <path d="M5 7h14" />
            <path d="M5 7l-2 6h4l-2-6z" />
            <path d="M19 7l-2 6h4l-2-6z" />
            <path d="M8 21h8" />
          </svg>
          <span>Conciliación con el grifo</span>
        </button>
        <button class="nav-item" data-route="estimacion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <line x1="8" y1="6" x2="16" y2="6" />
            <line x1="8" y1="10" x2="10" y2="10" />
            <line x1="14" y1="10" x2="16" y2="10" />
            <line x1="8" y1="14" x2="10" y2="14" />
            <line x1="14" y1="14" x2="16" y2="14" />
            <line x1="8" y1="18" x2="16" y2="18" />
          </svg>
          <span>Estimar costo de viaje</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="sidebar-avatar">ET</div>
          <div>
            <div class="user-name" id="sidebar-user-name">Encargado de Transporte</div>
            <div class="user-handle" id="sidebar-user-handle">admin.transporte</div>
          </div>
        </div>
        <button id="logout-btn" class="btn-logout" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Abrir menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <span id="topbar-icon" class="page-icon"></span>
          <div>
            <h1 id="topbar-title" class="page-title">Inicio</h1>
            <p id="topbar-subtitle" class="page-subtitle"></p>
          </div>
        </div>

        <div class="topbar-right">
          <div id="topbar-actions"></div>
          <div class="global-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input id="global-search-input" type="search" placeholder="Buscar unidad, vale o conductor" />
          </div>
          <button id="notif-btn" class="icon-pill-btn" type="button" aria-label="Notificaciones">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span id="notif-badge" class="notif-badge">3</span>
          </button>
          <div class="date-pill" title="Estado de conexión con API C#">
            <span id="api-status-dot" class="api-status-dot local"></span>
            <span id="topbar-date">12/11/2026</span>
          </div>
        </div>
      </header>

      <div id="view-container"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
